services:
  - type: web
    name: pinnaclestride-api
    runtime: node
    plan: free
    region: oregon
    branch: master
    buildCommand: pnpm install && pnpm build:packages && pnpm db:generate && pnpm --filter api build
    startCommand: pnpm --filter api start
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: TOTP_ENCRYPTION_KEY
        generateValue: true
